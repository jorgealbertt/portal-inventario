<style>
  .ios-install-dialog {
    width: min(440px, calc(100% - 32px));
    padding: 24px;
    border: 1px solid #dce5f0;
    border-radius: 18px;
    color: #17243a;
    background: #fff;
    box-shadow: 0 20px 70px #10233f40;
    font: 15px/1.5 ui-sans-serif, system-ui, sans-serif;
  }
  .ios-install-dialog::backdrop { background: #08111fb3; }
  .ios-install-dialog h2 { margin: 0 0 8px; font-size: 20px; }
  .ios-install-dialog p { margin: 0 0 14px; color: #526179; }
  .ios-install-dialog ol { margin: 0 0 20px; padding-left: 22px; }
  .ios-install-dialog li + li { margin-top: 8px; }
  .ios-install-dialog button {
    width: 100%; min-height: 44px; border: 0; border-radius: 10px;
    color: #fff; background: #24784f; font: inherit; font-weight: 700;
  }
  html[data-theme="dark"] .ios-install-dialog { border-color: #344a67; color: #e7edf7; background: #152238; }
  html[data-theme="dark"] .ios-install-dialog p { color: #bdcbe0; }
</style>
<dialog id="iosInstallDialog" class="ios-install-dialog" aria-labelledby="iosInstallTitle">
  <h2 id="iosInstallTitle">Instalar en tu iPhone</h2>
  <p id="iosInstallIntro">Sigue estos pasos para agregar la app a la pantalla de inicio:</p>
  <ol>
    <li>En Safari, toca <strong>Compartir</strong> <span aria-label="botón Compartir">(el cuadrado con la flecha hacia arriba)</span>.</li>
    <li>Desplázate y elige <strong>Agregar a pantalla de inicio</strong>.</li>
    <li>Toca <strong>Agregar</strong> para confirmar. Encontrarás la app junto a tus otras aplicaciones.</li>
  </ol>
  <button id="closeIosInstallDialog" type="button">Entendido</button>
</dialog>
<script>
  (() => {
    const button = document.getElementById("installButton");
    const dialog = document.getElementById("iosInstallDialog");
    const closeButton = document.getElementById("closeIosInstallDialog");
    if (!button || !dialog || !closeButton) return;

    const isAppleTouchDevice = /iPhone|iPad|iPod/i.test(navigator.userAgent) ||
      (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
    if (!isAppleTouchDevice) return;

    const isInstalled = navigator.standalone === true ||
      window.matchMedia("(display-mode: standalone)").matches;
    if (isInstalled) return;

    button.textContent = "Instalar en iPhone";
    button.setAttribute("aria-label", "Cómo instalar la app en iPhone");
    button.title = "Agregar esta app a la pantalla de inicio del iPhone";
    button.hidden = false;

    button.addEventListener("click", () => {
      if (typeof dialog.showModal === "function") dialog.showModal();
      else dialog.setAttribute("open", "");
    });
    closeButton.addEventListener("click", () => dialog.close());
  })();
</script>
