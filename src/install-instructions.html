<style>
  .install-guide {
    width: min(440px, calc(100% - 32px));
    max-height: min(80vh, 620px);
    overflow: auto;
    padding: 24px;
    border: 1px solid #dce5f0;
    border-radius: 18px;
    color: #17243a;
    background: #fff;
    box-shadow: 0 20px 70px #10233f40;
    font: 15px/1.5 ui-sans-serif, system-ui, sans-serif;
  }
  .install-guide::backdrop { background: #08111fb3; }
  .install-guide h2 { margin: 0 0 8px; font-size: 20px; }
  .install-guide p { margin: 0 0 14px; color: #526179; }
  .install-guide ol { margin: 0 0 20px; padding-left: 22px; }
  .install-guide li + li { margin-top: 8px; }
  .install-guide button {
    width: 100%; min-height: 44px; border: 0; border-radius: 10px;
    color: #fff; background: #24784f; font: inherit; font-weight: 700;
  }
  html[data-theme="dark"] .install-guide { border-color: #344a67; color: #e7edf7; background: #152238; }
  html[data-theme="dark"] .install-guide p { color: #bdcbe0; }
</style>
<dialog id="installGuide" class="install-guide" aria-labelledby="installGuideTitle">
  <h2 id="installGuideTitle">Instalar la app</h2>
  <p id="installGuideIntro"></p>
  <ol id="installGuideSteps"></ol>
  <button id="closeInstallGuide" type="button">Entendido</button>
</dialog>
<script>
  (() => {
    const button = document.getElementById("installButton");
    const dialog = document.getElementById("installGuide");
    const title = document.getElementById("installGuideTitle");
    const intro = document.getElementById("installGuideIntro");
    const steps = document.getElementById("installGuideSteps");
    const closeButton = document.getElementById("closeInstallGuide");
    if (!button || !dialog || !title || !intro || !steps) return;

    const userAgent = navigator.userAgent || "";
    const isAppleDevice = /iPhone|iPad|iPod/i.test(userAgent) ||
      (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
    const isAndroid = /Android/i.test(userAgent);
    const isInstalled = navigator.standalone === true ||
      window.matchMedia?.("(display-mode: standalone)").matches;
    if (isInstalled) {
      button.hidden = true;
      return;
    }

    let deferredPrompt = null;
    const platform = isAppleDevice ? "ios" : isAndroid ? "android" : "other";

    function showGuide() {
      const instructions = platform === "ios"
        ? {
            title: "Instalar en iPhone o iPad",
            intro: "Abre este portal en Safari y agrégalo a tu pantalla de inicio:",
            steps: [
              "Toca Compartir (el cuadrado con la flecha hacia arriba).",
              "Desplázate por las opciones y toca Agregar a pantalla de inicio.",
              "Toca Agregar para confirmar. La app aparecerá junto a tus otras aplicaciones."
            ]
          }
        : {
            title: "Instalar en Android",
            intro: "Si no se abre la instalación automática, usa el menú del navegador:",
            steps: [
              "En Chrome, toca el menú ⋮ de la esquina superior. En otros navegadores, abre su menú principal.",
              "Elige Instalar app o Agregar a pantalla principal.",
              "Confirma la instalación. El texto exacto puede variar según el navegador y el modelo del teléfono."
            ]
          };
      title.textContent = instructions.title;
      intro.textContent = instructions.intro;
      steps.replaceChildren(...instructions.steps.map((text) => {
        const item = document.createElement("li");
        item.textContent = text;
        return item;
      }));
      if (typeof dialog.showModal === "function") dialog.showModal();
      else dialog.setAttribute("open", "");
    }

    closeButton.addEventListener("click", () => {
      if (typeof dialog.close === "function") dialog.close();
      else dialog.removeAttribute("open");
    });

    if (isAppleDevice) {
      button.textContent = "Instalar en iPhone/iPad";
      button.setAttribute("aria-label", "Cómo instalar la app en iPhone o iPad");
      button.title = "Agregar la app a la pantalla de inicio";
      button.hidden = false;
      button.addEventListener("click", (event) => {
        event.stopImmediatePropagation();
        showGuide();
      }, true);
    } else if (isAndroid) {
      button.textContent = "Instalar app";
      button.setAttribute("aria-label", "Instalar la app en Android");
      button.hidden = false;
      window.addEventListener("beforeinstallprompt", (event) => {
        event.preventDefault();
        deferredPrompt = event;
      });
      button.addEventListener("click", async (event) => {
        event.stopImmediatePropagation();
        if (deferredPrompt) {
          const promptEvent = deferredPrompt;
          deferredPrompt = null;
          try {
            await promptEvent.prompt();
            const choice = await promptEvent.userChoice;
            if (choice?.outcome === "accepted") {
              button.hidden = true;
              return;
            }
          } catch {
            // Fall back to the browser-specific installation instructions.
          }
        }
        showGuide();
      }, true);
      window.addEventListener("appinstalled", () => {
        deferredPrompt = null;
        button.hidden = true;
      });
    }
  })();
</script>
